<style>
/* Layout: caderno de estudo — uma coluna estreita, cartão de pergunta no centro, marca-texto amarelo como destaque */
:root{
  --bg:#EEF2F8; --surface:#FFFFFF; --ink:#16233F; --muted:#5A6782; --line:#D6DDEA;
  --accent:#1F4FD1; --accent-ink:#FFFFFF; --mark:#FFE15A; --mark-ink:#16233F;
  --ok:#1E9E5A; --ok-soft:#DDF4E6; --bad:#D6453D; --bad-soft:#FBE3E1;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --radius:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1626; --surface:#18223A; --ink:#E9EEF8; --muted:#A3AEC6; --line:#2B3754;
  --accent:#7FA2FF; --accent-ink:#0F1626; --mark:#F2CF3A; --mark-ink:#16233F;
  --ok:#4FD08C; --ok-soft:#173A2A; --bad:#FF7C72; --bad-soft:#40211F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1626; --surface:#18223A; --ink:#E9EEF8; --muted:#A3AEC6; --line:#2B3754;
  --accent:#7FA2FF; --accent-ink:#0F1626; --mark:#F2CF3A; --mark-ink:#16233F;
  --ok:#4FD08C; --ok-soft:#173A2A; --bad:#FF7C72; --bad-soft:#40211F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:2rem;font-weight:700}
h2{font-size:1.4rem;font-weight:600}
h3{font-size:1.1rem;font-weight:600}
.mark{background:linear-gradient(transparent 55%,var(--mark) 55%);color:inherit;padding:0 .1em}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--muted)}

button,.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 20px;cursor:pointer;background:var(--accent);color:var(--accent-ink);min-height:46px}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
button.link{background:none;color:var(--accent);padding:6px 4px;min-height:0;border-radius:6px}
button.danger{background:var(--bad);color:#fff}
button.ok{background:var(--ok);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible,.opt:focus-visible{outline:3px solid var(--mark);outline-offset:2px}

/* slides */
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:var(--accent);color:#fff;border-radius:18px;overflow:hidden;container-type:inline-size}
.slide{position:absolute;inset:0;padding:6cqw 7cqw;display:flex;flex-direction:column;gap:2.4cqw;background:#FFFFFF;color:#16233F}
.slide.capa{background:#1F4FD1;color:#fff;justify-content:center}
.slide .em{font-size:7cqw;line-height:1}
.slide h2{font-size:5.2cqw;font-family:var(--display);color:inherit}
.slide.capa h2{font-size:7.5cqw}
.slide ul{margin:0;padding-left:4cqw;display:flex;flex-direction:column;gap:1.2cqw;font-size:3.1cqw;line-height:1.3}
.slide .dest{margin-top:auto;background:#FFE15A;color:#16233F;border-radius:1.6cqw;padding:1.6cqw 2.4cqw;font-weight:800;font-size:2.8cqw}

.slide .bar{position:absolute;left:0;top:0;bottom:0;width:1.4cqw;background:#FFE15A}
.stage:fullscreen{border-radius:0;aspect-ratio:auto;background:#000;display:flex;align-items:center}
.stage:fullscreen .slide{inset:auto;position:relative;width:100%;aspect-ratio:16/9;margin:auto}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.thumb{padding:0;background:none;border:2px solid var(--line);border-radius:12px;overflow:hidden;min-height:0}

<script>
/*PARSER_START*/
function parseRevisao(texto){
  const lines = texto.replace(/\r/g,'').split('\n');
  const out = {titulo:'', subtitulo:'', partes:[]};
  let parte=null, q=null, modo=null;
  const limpa = s => s.replace(/^[^\p{L}\p{N}]+/u,'').trim();
  const emojiDe = s => { const m = s.match(/^\s*(\p{Extended_Pictographic}️?)/u); return m?m[1]:''; };
  const prox = i => { for(let j=i+1;j<lines.length;j++){ const t=lines[j].trim(); if(t && !/^[⸻—\-_=]{1,}$/.test(t)) return t; } return ''; };
  const ehResp = t => /^resposta\s*:?/i.test(t);
  const ehOpc = t => /^[A-Ea-e]\)\s*/.test(t);
  const fecha = () => { if(q && parte){ q.p=q.p.trim(); q.r=q.r.trim(); if(q.p) parte.perguntas.push(q);} q=null; modo=null; };
  for(let i=0;i<lines.length;i++){
    let t = lines[i].trim();
    if(!t || /^[⸻—\-_=]{1,}$/.test(t)) continue;
    const bullet = /^([*•\-]|\d+[.)])\s+/.test(t);
    const semBullet = t.replace(/^([*•\-]|\d+[.)])\s+/,'');
    const letras = semBullet.replace(/[^\p{L}]/gu,'');
    const caixaAlta = letras.length>3 && letras===letras.toUpperCase();
    if(!bullet && !ehResp(t) && !ehOpc(t) && (/\bPARTE\b|DESAFIO/i.test(t) || caixaAlta)){
      if(!out.titulo && !out.partes.length && !/\bPARTE\b/i.test(t)){ out.titulo = limpa(t); continue; }
      fecha();
      parte = {nome: limpa(t), emoji: emojiDe(t), perguntas: []};
      out.partes.push(parte); continue;
    }
    if(!parte){ if(out.titulo && !out.subtitulo) out.subtitulo = t; continue; }
    if(ehResp(t)){ if(!q) q={p:'',r:'',opcoes:[]}; modo='r'; q.r = t.replace(/^resposta\s*:?\s*/i,''); continue; }
    if(ehOpc(t) && q && modo!=='r'){ q.opcoes.push(t); continue; }
    if(bullet){
      const nx = prox(i);
      if(ehResp(nx) || ehOpc(nx) || !q || modo!=='r'){
        if(q && modo!=='r' && !(ehResp(nx)||ehOpc(nx))){ q.p += '\n'+semBullet; continue; }
        fecha(); q={p:semBullet,r:'',opcoes:[]}; modo='p'; continue;
      }
      q.r += (q.r?'\n':'')+'• '+semBullet; continue;
    }
    if(q){ if(modo==='r') q.r += (q.r?'\n':'')+t; else q.p += '\n'+t; }
  }
  fecha();
  out.partes = out.partes.filter(p=>p.perguntas.length);
  out.partes.forEach(p=>p.perguntas.forEach(q=>{ if(!q.opcoes.length) delete q.opcoes; }));
  return out;
}
/*PARSER_END*/

const $app = document.getElementById('app');
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db=null, podeEscrever=true, modoLocal=false, carregado=false;
let revisoes=[];
let S = {view:'home'};

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2200); }
function total(r){ return (r.partes||[]).reduce((a,p)=>a+(p.perguntas||[]).length,0); }
function lerLocal(){ try{ return JSON.parse(localStorage.getItem('revisoes-app')||'[]'); }catch(e){ return []; } }
function gravarLocal(){ try{ localStorage.setItem('revisoes-app', JSON.stringify(revisoes)); }catch(e){} }

async function salvar(rev){
  rev.atualizadaEm = new Date().toISOString();
  if(!rev.id) rev.id = 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const {id, ...corpo} = rev;
  if(db && !modoLocal){
    await db.collection('revisoes').doc(id).set(JSON.parse(JSON.stringify(corpo)));
  } else {
    const i = revisoes.findIndex(r=>r.id===id);
    if(i>=0) revisoes[i]=rev; else revisoes.push(rev);
    gravarLocal(); render();
  }
  return id;
}
async function apagar(id){
  if(db && !modoLocal) await db.collection('revisoes').doc(id).delete();
  else { revisoes = revisoes.filter(r=>r.id!==id); gravarLocal(); render(); }
}

/* ---------- telas ---------- */
let aba='revisoes', viewsPorAba={revisoes:{view:'home'},chat:null,slides:{view:'slidesHome'}};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  if(b.dataset.tab===aba){ if(aba==='revisoes') S={view:'home'}; if(aba==='slides') S={view:'slidesHome'}; render(); window.scrollTo(0,0); return; }
  if(aba!=='config') viewsPorAba[aba]=S; aba=b.dataset.tab;
  S = viewsPorAba[aba] || (aba==='chat'?{view:'chat'}:aba==='slides'?{view:'slidesHome'}:{view:'home'});
  render(); window.scrollTo(0, aba==='chat'?document.body.scrollHeight:0);
});
function telaConfig(){
  const k=chaveIA();
  $app.innerHTML=`

      <h3>Ativar a IA ${k?'<span class="chip" style="color:var(--ok);border-color:var(--ok)">ativa</span>':''}</h3>
      <p class="small" style="margin:0">A IA do app (Chat, Slides e criar revisões) usa uma <b>chave da Anthropic</b>, a empresa do Claude. Você cria a chave uma vez e cola aqui. Ela fica guardada <b>só neste celular</b>.</p>
      <ol class="small" style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px">
        <li>Entre em <b>console.anthropic.com</b> e crie a conta.</li>
        <li>Em <b>Billing</b>, coloque créditos (a partir de US$ 5).</li>
        <li>Em <b>API Keys</b>, toque em <b>Create Key</b> e copie a chave (começa com <b>sk-ant-</b>).</li>
        <li>Cole aqui embaixo e toque em <b>Salvar e testar</b>.</li>
      </ol>
      <label class="f">Chave da IA<input type="password" id="chave" autocomplete="off" placeholder="sk-ant-..." value="${esc(k)}"></label>
      <div class="row"><button id="salvarChave">Salvar e testar</button>${k?'<button class="link" id="tirarChave" style="color:var(--bad)">Remover chave</button>':''}</div>
      <div id="cStatus" class="small" hidden></div>
    </div>
    <div class="box">
      <h3>Levar as revisões para outro celular</h3>
      <p class="small muted" style="margin:0">As revisões e os slides ficam salvos neste aparelho. Para passar para outro celular, copie a cópia de segurança aqui, mande por WhatsApp e cole no outro app.</p>
      <div class="row"><button class="ghost" id="copiaBackup">Copiar cópia de segurança</button></div>
      <label class="f">Colar cópia de segurança<textarea id="backupIn" rows="3" placeholder="Cole aqui o texto copiado do outro celular"></textarea></label>

/* ---------- IA ---------- */
/* ---------- IA própria do app (chave da API da Anthropic, guardada só neste aparelho) ---------- */
const MODELO_IA = 'claude-sonnet-5-5';
function chaveIA(){ try{ return localStorage.getItem('revisoes-chave')||''; }catch(e){ return ''; } }
function blobParaB64(b){ return new Promise((ok,err)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]); r.onerror=err; r.readAsDataURL(b); }); }
async function montarMsgs(input,images){
  let msgs = typeof input==='string' ? [{role:'user',content:input}] : input.map(m=>({role:m.role,content:m.content}));
  if(images && images.length){
    const last=msgs[msgs.length-1]; const partes=[];
    for(const im of images){ partes.push({type:'image',source:{type:'base64',media_type:im.type||'image/jpeg',data:await blobParaB64(im)}}); }
    partes.push({type:'text',text:String(last.content)}); last.content=partes;
  }
  return msgs;
}
async function chamarIA(input,opts={}){
  const key=chaveIA(); if(!key) throw {code:'sem_chave',message:'sem chave'};
  const body={model:MODELO_IA,max_tokens:opts.maxTokens||8000,stream:true,messages:await montarMsgs(input,opts.images)};
  if(opts.system) body.system=opts.system;
  let resp;
  try{
    resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:opts.signal,headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
  }catch(e){ if(e&&e.name==='AbortError') throw {code:'cancelled'}; throw {code:'offline'}; }
  if(!resp.ok){ let msg=''; try{ msg=(await resp.json()).error.message; }catch(e){}
    throw {code: resp.status===401?'chave_invalida': resp.status===429||resp.status===529?'rate_limited': resp.status===400&&/credit/i.test(msg)?'sem_credito':'upstream_error', message:msg}; }
  const rd=resp.body.getReader(), dec=new TextDecoder(); let buf='', text='';
  try{
    while(true){ const {value,done}=await rd.read(); if(done) break; buf+=dec.decode(value,{stream:true});
      let i; while((i=buf.indexOf('\n'))>=0){ const l=buf.slice(0,i).trim(); buf=buf.slice(i+1);
        if(!l.startsWith('data:')) continue; let ev; try{ ev=JSON.parse(l.slice(5)); }catch(e){ continue; }
        if(ev.type==='content_block_delta' && ev.delta && ev.delta.type==='text_delta'){ text+=ev.delta.text; if(opts.onText) opts.onText({text,delta:ev.delta.text}); }
        if(ev.type==='error') throw {code:'upstream_error',text}; } }
  }catch(e){ if(e&&e.name==='AbortError') throw {code:'cancelled',text}; throw e.code?e:{code:'upstream_error',text}; }
  return {text};
}
function extrairJSON(t){
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/); if(f) t=f[1];
  const a=t.search(/[\[{]/); if(a<0) throw {code:'invalid_json',text:t};
  const z=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
  try{ return JSON.parse(t.slice(a,z+1)); }catch(e){ throw {code:'invalid_json',text:t}; }
}
const sampleProprio = Object.assign((input,opts)=>chamarIA(input,opts),{
  json: async(input,opts={})=>{ const r=await chamarIA(input,opts); return extrairJSON(r.text); },
  limits: async()=>({images:{maxCount:4}})
});
let sampleLimites={images:{maxCount:4}};
async function getSample(){
  if(!chaveIA()){ S={view:'config',voltar:{aba,S}}; aba='config'; render(); window.scrollTo(0,0); toast('Primeiro, ative a IA com a sua chave'); return null; }
  return sampleProprio;
}

const FORMATO = `Responda SOMENTE com JSON neste formato:
{"titulo":"Revisão de ...","materia":"...","serie":"...","partes":[{"nome":"PARTE 1 — ...","emoji":"🟢","perguntas":[{"p":"pergunta","r":"resposta"},{"p":"pergunta de múltipla escolha","opcoes":["A) ...","B) ...","C) ...","D) ..."],"r":"C) texto da alternativa certa"}]}]}`;
const REGRAS = `Regras:
- Português do Brasil, linguagem simples e adequada à série informada.
- Conteúdo 100% correto, como num livro didático brasileiro (BNCC). Na dúvida, não invente.
- Respostas curtas e diretas, para a criança conferir sozinha. Em respostas com vários itens, um item por linha começando com "• ".
- Múltipla escolha: exatamente 4 opções "A) ... B) ... C) ... D) ...", só uma correta, e "r" começa pela letra certa.
- Varie os tipos: conceito, exemplo, complete a frase, identifique, múltipla escolha.
- Agrupe em partes por tema, do mais fácil ao mais difícil. A última parte se chama "DESAFIO FINAL" com emoji 🏆 e mistura tudo.
- Use emojis de bolinha colorida diferentes para cada parte (🟢 🔵 🟡 🔴 🟣 🟠).`;
function erroIA(e){
  const c=e&&e.code;
  if(c==='sem_chave') return 'Ative a IA em Configurações (botão ⚙️ no alto).';
  if(c==='chave_invalida') return 'A chave da IA não foi aceita. Confira em Configurações (⚙️).';
  if(c==='sem_credito') return 'Acabaram os créditos da IA. Coloque créditos em console.anthropic.com.';
  if(c==='offline') return 'Sem internet. A IA precisa de conexão.';
  if(c==='rate_limited') return 'A IA está ocupada agora. Espere um minuto e tente de novo.';
  if(c==='invalid_json') return 'A IA respondeu fora do formato. Tente de novo.';
  if(c==='cancelled') return 'Criação cancelada.';
  return 'Não foi possível agora. Tente de novo em instantes.';
}
function normalizar(res){
  const d={titulo:String(res.titulo||'').trim(),materia:String(res.materia||'').trim(),serie:String(res.serie||'').trim(),subtitulo:'Criada com IA',partes:[]};
  (res.partes||[]).forEach(p=>{
    const perg=(p.perguntas||[]).filter(q=>q&&q.p).map(q=>{const o={p:String(q.p).trim(),r:String(q.r||'').trim()}; if(Array.isArray(q.opcoes)&&q.opcoes.length) o.opcoes=q.opcoes.map(String); return o;});
    if(perg.length) d.partes.push({nome:String(p.nome||'Parte').trim(),emoji:String(p.emoji||''),perguntas:perg});
  });
  return d;
}

}

Parte: "${p.nome}". Perguntas que já existem nesta parte (NÃO repita):
${p.perguntas.map(q=>'- '+q.p).join('\n')}

Crie 5 perguntas NOVAS para esta mesma parte, no mesmo nível.
${REGRAS}

Responda SOMENTE com JSON: {"perguntas":[{"p":"...","r":"..."},{"p":"...","opcoes":["A) ...","B) ...","C) ...","D) ..."],"r":"B) ..."}]}`;
  try{
    const res=await sp.json(prompt,{modelTier:'default'});
    const novas=normalizar({partes:[{nome:'x',perguntas:res.perguntas||[]}]}).partes[0];

}

function prep(){

      </div>
      <label class="part"><input type="checkbox" id="emb" ${S.embaralhar?'checked':''}> Misturar a ordem das perguntas</label>
      <button id="comecar">Começar</button>

  document.getElementById('voltar').onclick=()=>{S={view:'home'};render();};
  r.partes.forEach((p,i)=>document.getElementById('p'+i).onchange=e=>S.sel[i]=e.target.checked);

function iniciar(deck){
  if(S.embaralhar){ for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];} }
  S = {...S, view:'estudo', deck, i:0, revelada:false, escolha:null, acertos:0, erros:[]};
  render(); window.scrollTo(0,0);
}

function letraCerta(q){ const m=(q.r||'').match(/^\s*([A-Ea-e])\)/); return m?m[1].toUpperCase():null; }

function estudo(){
  const q=S.deck[S.i], n=S.deck.length, certa=letraCerta(q), temOpc=q.opcoes&&q.opcoes.length&&certa;
  $app.innerHTML = `
    <div class="top"><button class="link" id="sair">← Sair</button><span class="muted small" style="font-variant-numeric:tabular-nums">${S.i+1} de ${n} · ${S.acertos} acertos</span></div>
    <div class="progress"><span style="width:${(S.i/n)*100}%"></span></div>
    <div class="card">
      <span class="chip" style="align-self:flex-start">${esc(q.emoji)} ${esc(q.parte)}</span>
      <div class="q">${esc(q.p)}</div>
      ${temOpc?`<div class="opts">${q.opcoes.map(o=>{const L=o.trim()[0].toUpperCase();
        let c=''; if(S.escolha){ if(L===certa) c='right'; else if(L===S.escolha) c='wrong'; }
        return `<button class="opt ${c}" data-l="${L}" ${S.escolha?'disabled':''}>${esc(o)}</button>`;}).join('')}</div>`
      : (q.opcoes&&q.opcoes.length? `<ul>${q.opcoes.map(o=>`<li>${esc(o)}</li>`).join('')}</ul>`:'')}
      ${S.revelada?`<div class="ans">${esc(q.r||'(sem resposta cadastrada)')}</div>`:''}
    </div>
    <div class="row" id="acoes"></div>`;
  const ac=document.getElementById('acoes');
  document.getElementById('sair').onclick=()=>{S={view:'home'};render();};
  if(temOpc && !S.escolha){
    $app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ S.escolha=b.dataset.l; S.revelada=true; if(S.escolha===certa) S.acertos++; else S.erros.push(q); render(); });
    ac.innerHTML='<span class="muted small">Toque na alternativa certa.</span>';
  } else if(temOpc){
    ac.innerHTML=`<span style="font-weight:800;color:var(${S.escolha===certa?'--ok':'--bad'})">${S.escolha===certa?'Acertou!':'Quase! Veja a certa em verde.'}</span><button id="prox" style="margin-left:auto">Próxima →</button>`;
    document.getElementById('prox').onclick=avancar;
  } else if(!S.revelada){
    ac.innerHTML='<button id="ver" style="flex:1">Mostrar resposta</button>';
    document.getElementById('ver').onclick=()=>{S.revelada=true;render();};
  } else {
    ac.innerHTML='<button class="danger" id="errei" style="flex:1">Errei</button><button class="ok" id="acertei" style="flex:1">Acertei</button>';
    document.getElementById('errei').onclick=()=>{S.erros.push(q);avancar();};
    document.getElementById('acertei').onclick=()=>{S.acertos++;avancar();};

function md(t){
  let h=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<i>$2</i>');
  const out=[]; let lista=null;
  h.split('\n').forEach(l=>{
    const m=l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);
    if(m){ if(!lista){lista=[];} lista.push('<li>'+m[1]+'</li>'); return; }
    if(lista){ out.push('<ul>'+lista.join('')+'</ul>'); lista=null; }
    const t2=l.replace(/^#{1,4}\s+(.*)/,'<b>$1</b>');
    if(t2.trim()) out.push('<p>'+t2+'</p>');
  });
  if(lista) out.push('<ul>'+lista.join('')+'</ul>');
  return out.join('');
}

async function enviarChat(){
  const ta=document.getElementById('chatIn'); const txt=(ta.value||'').trim();
  if(chatRespondendo) return;
  if(!txt && !chatFotos.length) return;
  const sp=await getSample(); if(!sp){ toast('Ative a IA em Configurações.'); return; }
  const fotos=chatFotos; chatFotos=[];
  const msgU={role:'user',content:txt||'O que tem nesta foto?'}; if(fotos.length) msgU.fotoUrl=URL.createObjectURL(fotos[0]);
  conversa.push(msgU); const msgA={role:'assistant',content:''}; conversa.push(msgA);
  try{ sessionStorage.removeItem('revisoes-rascunho'); }catch(e){}
  chatRespondendo=true; render(); window.scrollTo(0,document.body.scrollHeight);
  const hist=conversa.slice(0,-1).slice(-20).map(m=>({role:m.role,content:m.content||'…'}));
  while(hist.length && hist[0].role!=='user') hist.shift();
  hist[0]={role:'user',content:'(Instruções: você é a IA do Revisões App, um assistente da família. Responda em português do Brasil, de forma clara, amigável e direta. Quando a pergunta for de escola, explique de um jeito que uma criança entenda. Use listas curtas quando ajudar.)\n\n'+hist[0].content};
  chatCtrl=new AbortController();
  let ultimo=0;
  try{
    const opts={signal:chatCtrl.signal,cache:false,modelTier:'default',onText:({text})=>{ msgA.content=text; const now=Date.now(); if(now-ultimo>120 && S.view==='chat'){ ultimo=now; const bs=$app.querySelectorAll('.msg.a'); const el=bs[bs.length-1]; if(el){ el.innerHTML=md(text); } } }};
    if(fotos.length) opts.images=fotos;
    const r=await sp(hist,opts);
    msgA.content=r.text||msgA.content;
  }catch(e){
    if(e&&e.code==='cancelled'){ if(!msgA.content) msgA.content='(resposta interrompida)'; }
    else { msgA.content=(e&&e.text)||''; if(!msgA.content){ conversa.pop(); } toast(erroIA(e)); }
  }
  chatRespondendo=false; chatCtrl=null; gravarChat();
  if(S.view==='chat'){ render(); window.scrollTo(0,document.body.scrollHeight); }
}

async function salvarDeck(d){

async function apagarDeck(id){

    render(); window.scrollTo(0,0);
