<style>
:root{--terra:#b5502a;--ocre:#e0a030;--verde:#2f7d4f;--noite:#2a1a12;--areia:#fbf3e4;--creme:#fffaf0;--certo:#2f9e5b;--errado:#c9372c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:var(--areia);color:var(--noite);min-height:100vh}
.kente{height:12px;background:repeating-linear-gradient(90deg,#e0a030 0 18px,#2f7d4f 18px 26px,#c9372c 26px 34px,#2a1a12 34px 38px,#e0a030 38px 56px,#1f4e8c 56px 62px)}
nav.menu{display:flex;gap:6px;justify-content:center;padding:10px 10px 0;flex-wrap:wrap}
nav.menu a{font:700 15px 'Baloo 2',sans-serif;text-decoration:none;color:var(--terra);background:#fff;border:2px solid #e9d3b4;border-radius:99px;padding:4px 14px}
nav.menu a.on{background:var(--terra);color:#fff;border-color:var(--terra)}
.wrap{max-width:1100px;margin:0 auto;padding:12px 14px 40px}
.card{background:var(--creme);border-radius:22px;box-shadow:0 6px 0 rgba(42,26,18,.12),0 10px 30px rgba(42,26,18,.08);overflow:hidden}
.grid{display:grid;grid-template-columns:1fr}
@media(min-width:900px){.grid.jogo{grid-template-columns:1.2fr 1fr}.grid.jogo .side{border-left:2px solid #f0e2c8}}
.palco{background:linear-gradient(160deg,#7a2e4a,#e2683a 60%,#ffc061);display:flex;align-items:center;justify-content:center;padding:28px;min-height:280px}
.bandeira{width:100%;max-width:560px;aspect-ratio:4/3;object-fit:cover;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);border:6px solid #fff;background:#fff}
.body{padding:18px 18px 22px}
h1,h2,.btn{font-family:'Baloo 2',cursive}
h1{font-size:32px;line-height:1.05;color:var(--terra);margin-bottom:8px}
.sub{font-size:17px;line-height:1.45;margin-bottom:14px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font-size:20px;font-weight:800;cursor:pointer;background:var(--terra);color:#fff;box-shadow:0 4px 0 #7d3219;margin-top:10px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7d3219}
.btn.sec{background:#fff;color:var(--terra);box-shadow:0 4px 0 #e2c9a8;border:2px solid #e9d3b4}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}
.prog{flex:1;height:12px;background:#ead8bb;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--verde),var(--ocre));transition:width .3s}
.num,.pts{font-family:'Baloo 2';font-weight:800;font-size:17px;white-space:nowrap}.pts{color:var(--verde)}
h2{font-size:30px;line-height:1.1;margin:4px 0 14px}
.ops{display:grid;gap:10px}
.op{text-align:left;font:700 19px 'Nunito';padding:13px 14px;border-radius:14px;border:2px solid #e9d3b4;background:#fff;cursor:pointer;display:flex;gap:10px;align-items:center;color:var(--noite)}
.op b{font-family:'Baloo 2';display:inline-grid;place-items:center;min-width:32px;height:32px;border-radius:50%;background:#f3e3c7;color:var(--terra)}
.op:disabled{cursor:default}
.op.ok{border-color:var(--certo);background:#e5f6ec}.op.ok b{background:var(--certo);color:#fff}
.op.no{border-color:var(--errado);background:#fbe7e4}.op.no b{background:var(--errado);color:#fff}
.fb{margin-top:14px;padding:14px;border-radius:14px;font-size:17px;line-height:1.45;display:none}
.fb.show{display:block}.fb.ok{background:#e5f6ec;border-left:6px solid var(--certo)}.fb.no{background:#fbe7e4;border-left:6px solid var(--errado)}
.fb strong{font-family:'Baloo 2';font-size:21px;display:block;margin-bottom:2px}
#next{display:none}
.big{font-family:'Baloo 2';font-size:64px;font-weight:800;color:var(--terra);text-align:center;line-height:1}
.msg{text-align:center;font-size:18px;margin:8px 0 10px}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:10px}
.galeria div{background:#fff;border-radius:12px;padding:8px;text-align:center;font-weight:700;font-size:14px;border:2px solid #efe0c6}
.galeria img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:1px solid #ddd;margin-bottom:4px}
.galeria small{display:block;font-weight:600;color:#8a6a50}
.galeria.erros div{border-color:#f0b9b2}
</style>

const app=document.getElementById('app'),L='ABCD';
let fila=[],i=0,pts=0,erros=[],resp=false;
function emb(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function opcoes(k){
  const a=PAISES[k];
  const viz=PAISES.map((p,j)=>[j,(p.x-a.x)**2+(p.y-a.y)**2]).filter(x=>x[0]!==k).sort((p,q)=>p[1]-q[1]).slice(0,5);
  const v=emb(viz)[0][0];
  const outros=emb(PAISES.map((_,j)=>j).filter(j=>j!==k&&j!==v)).slice(0,2);
  return emb([k,v,...outros]);
}
function capa(){
  app.innerHTML=`<div class="grid"><div class="palco"><img class="bandeira" src="${PAISES[Math.floor(Math.random()*54)].f}" alt=""></div>
  <div class="body"><h1>Qual é essa bandeira?</h1>
  <p class="sub">A África tem <b>54 países</b>, e cada um tem a sua bandeira. Uma bandeira vai aparecer na tela: a turma fala de qual país ela é, e você toca na resposta!</p>
  <button class="btn" id="todos">Jogar com as 54 bandeiras</button>
  <button class="btn sec" id="dez">Rodada rápida (10 bandeiras)</button>
  <button class="btn sec" id="ver">Ver todas as bandeiras</button></div></div>`;
  document.getElementById('todos').onclick=()=>inicia(54);
  document.getElementById('dez').onclick=()=>inicia(10);
  document.getElementById('ver').onclick=verTodas;
}
function cartoes(lista){return lista.map(k=>`<div><img src="${PAISES[k].f}" alt="Bandeira de ${PAISES[k].n}">${PAISES[k].n}<small>${PAISES[k].c}</small></div>`).join('')}
function verTodas(){
  const ord=PAISES.map((_,k)=>k).sort((a,b)=>PAISES[a].n.localeCompare(PAISES[b].n,'pt'));
  app.innerHTML=`<div class="body"><h2>As 54 bandeiras da África</h2><div class="galeria">${cartoes(ord)}</div><button class="btn" id="volta">Voltar</button></div>`;
  document.getElementById('volta').onclick=capa;window.scrollTo({top:0});
}
function inicia(n){fila=emb(PAISES.map((_,k)=>k)).slice(0,n);i=0;pts=0;erros=[];show()}
function show(){
  resp=false;const k=fila[i],ops=opcoes(k);
  app.innerHTML=`<div class="grid jogo"><div class="palco"><img class="bandeira" src="${PAISES[k].f}" alt="Bandeira"></div>
  <div class="side body"><div class="top"><span class="num">${i+1}/${fila.length}</span><div class="prog"><i style="width:${i/fila.length*100}%"></i></div><span class="pts">⭐ ${pts}</span></div>
  <h2>De qual país é essa bandeira?</h2>
  <div class="ops">${ops.map((o,j)=>`<button class="op" data-k="${o}"><b>${L[j]}</b><span>${PAISES[o].n}</span></button>`).join('')}</div>
  <div class="fb" id="fb"></div>
  <button class="btn" id="next">${i<fila.length-1?'Próxima bandeira →':'Ver resultado'}</button></div></div>`;
  app.querySelectorAll('.op').forEach(b=>b.onclick=()=>responde(+b.dataset.k,b));
  document.getElementById('next').onclick=()=>{i++;i<fila.length?show():fim()};
  window.scrollTo({top:0,behavior:'smooth'});
}
function responde(e,btn){
  if(resp)return;resp=true;const k=fila[i],ok=e===k,p=PAISES[k];
  app.querySelectorAll('.op').forEach(b=>{b.disabled=true;if(+b.dataset.k===k)b.classList.add('ok')});
  if(ok)pts++;else{btn.classList.add('no');erros.push(k)}
  const luso=p.l===1?' Lá também se fala <b>português</b>!':p.l===2?' O português é uma das línguas oficiais de lá!':'';
  const fb=document.getElementById('fb');fb.className='fb show '+(ok?'ok':'no');
  fb.innerHTML=`<strong>${ok?['Isso aí!','Mandou bem!','Axé! Acertou!','Certíssimo!','Show!'][i%5]:'É a bandeira de '+p.n+'!'}</strong>Capital: <b>${p.c}</b>.${luso}`;
  app.querySelector('.pts').textContent='⭐ '+pts;
  document.getElementById('next').style.display='block';
}
function fim(){
  const n=fila.length,pc=pts/n;
  const m=pc>=.9?'Vocês são craques das bandeiras africanas! 🏆':pc>=.7?'Muito bem! 🎉':pc>=.5?'Bom trabalho! Bora treinar mais 💪':'São muitas bandeiras — joguem de novo! 🌍';
  app.innerHTML=`<div class="body"><div class="big">${pts}/${n}</div><p class="msg">${m}</p>
  <button class="btn" id="re">Jogar de novo</button><button class="btn sec" id="cp">Voltar ao início</button>
  ${erros.length?`<h2 style="font-size:22px;margin-top:18px">Bandeiras para revisar</h2><div class="galeria erros">${cartoes(erros)}</div>`:''}</div>`;
  document.getElementById('re').onclick=()=>inicia(n);document.getElementById('cp').onclick=capa;window.scrollTo({top:0});
}
capa();
</script>
</body>
</html>
