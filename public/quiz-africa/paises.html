<style>
:root{--terra:#b5502a;--ocre:#e0a030;--verde:#2f7d4f;--noite:#2a1a12;--areia:#fbf3e4;--creme:#fffaf0;--certo:#2f9e5b;--errado:#c9372c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:var(--areia);color:var(--noite);min-height:100vh}
.kente{height:12px;background:repeating-linear-gradient(90deg,#e0a030 0 18px,#2f7d4f 18px 26px,#c9372c 26px 34px,#2a1a12 34px 38px,#e0a030 38px 56px,#1f4e8c 56px 62px)}
nav{display:flex;gap:6px;justify-content:center;padding:10px 10px 0;flex-wrap:wrap}
nav a{font:700 15px 'Baloo 2';text-decoration:none;color:var(--terra);background:#fff;border:2px solid #e9d3b4;border-radius:99px;padding:4px 14px}
nav a.on{background:var(--terra);color:#fff;border-color:var(--terra)}
.wrap{max-width:1100px;margin:0 auto;padding:12px 14px 40px}
.card{background:var(--creme);border-radius:22px;box-shadow:0 6px 0 rgba(42,26,18,.12),0 10px 30px rgba(42,26,18,.08);overflow:hidden}
.grid{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:900px){.grid{grid-template-columns:1.4fr 1fr}.grid .side{border-left:2px solid #f0e2c8}}
.mapa{background:#7fb6d6;display:block;width:100%;height:auto;max-height:78vh}
.body{padding:18px 18px 22px}
h1,h2,.btn,.tag{font-family:'Baloo 2',cursive}
h1{font-size:32px;line-height:1.05;color:var(--terra);margin-bottom:8px}
.sub{font-size:17px;line-height:1.45;margin-bottom:16px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font-size:20px;font-weight:800;cursor:pointer;background:var(--terra);color:#fff;box-shadow:0 4px 0 #7d3219;margin-top:10px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7d3219}
.btn.sec{background:#fff;color:var(--terra);box-shadow:0 4px 0 #e2c9a8;border:2px solid #e9d3b4}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}
.prog{flex:1;height:12px;background:#ead8bb;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--verde),var(--ocre));transition:width .3s}
.num,.pts{font-family:'Baloo 2';font-weight:800;font-size:17px;white-space:nowrap}.pts{color:var(--verde)}
h2{font-size:30px;line-height:1.1;margin:4px 0 14px}
.ops{display:grid;gap:10px}
.op{text-align:left;font:700 19px 'Nunito';padding:13px 14px;border-radius:14px;border:2px solid #e9d3b4;background:#fff;cursor:pointer;display:flex;gap:10px;align-items:center;color:var(--noite)}
.op b{font-family:'Baloo 2';display:inline-grid;place-items:center;min-width:32px;height:32px;border-radius:50%;background:#f3e3c7;color:var(--terra)}
.op:disabled{cursor:default}
.op.ok{border-color:var(--certo);background:#e5f6ec}.op.ok b{background:var(--certo);color:#fff}
.op.no{border-color:var(--errado);background:#fbe7e4}.op.no b{background:var(--errado);color:#fff}
.fb{margin-top:14px;padding:14px;border-radius:14px;font-size:17px;line-height:1.45;display:none}
.fb.show{display:block}.fb.ok{background:#e5f6ec;border-left:6px solid var(--certo)}.fb.no{background:#fbe7e4;border-left:6px solid var(--errado)}
.fb strong{font-family:'Baloo 2';font-size:21px;display:block;margin-bottom:2px}
#next{display:none}
.big{font-family:'Baloo 2';font-size:64px;font-weight:800;color:var(--terra);text-align:center;line-height:1}
.msg{text-align:center;font-size:18px;margin:8px 0 10px}
.rev h3{font-family:'Baloo 2';font-size:19px;margin:14px 0 8px}
.rev .it{background:#fff;border-radius:12px;padding:8px 12px;margin-bottom:6px;border-left:5px solid var(--errado);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.chips span{background:#fff;border:2px solid #efe0c6;border-radius:99px;padding:3px 10px;font-size:14px;font-weight:700}
.pais{fill:#f1d9a4;stroke:#9b7a4a;stroke-width:1;transition:fill .25s}
.pais.alvo{fill:#c9372c}
.pais.certo{fill:#2f9e5b}
.pais.errou{fill:#e0a030}
.ctx{fill:#d9cdb8;stroke:#c2b49c;stroke-width:.5}
.anel{fill:none;stroke:#c9372c;stroke-width:4;animation:pulsa 1.2s ease-in-out infinite}
.anel.verde{stroke:#2f9e5b}
@keyframes pulsa{0%,100%{stroke-opacity:1;stroke-width:4}50%{stroke-opacity:.35;stroke-width:8}}
.rot{font:800 22px 'Nunito';fill:#2a1a12;paint-order:stroke;stroke:#fffaf0;stroke-width:4px;pointer-events:none}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;font-weight:700;margin:10px 0 0}
.legenda i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
</style>

  document.getElementById('dez').onclick=()=>inicia(10);
  document.getElementById('ver').onclick=verTodos;
}
function verTodos(){
  limpar();PAISES.forEach((p,k)=>{anel(k,'verde');rotulo(k)});
  marks.querySelectorAll('.rot').forEach(t=>t.style.fontSize='13px');
  app.innerHTML=`<h2>Os 54 países</h2><div class="chips">${PAISES.map(p=>p.n).sort((a,b)=>a.localeCompare(b,'pt')).map(n=>`<span>${n}</span>`).join('')}</div><button class="btn" id="volta">Voltar</button>`;
  document.getElementById('volta').onclick=capa;
}
function inicia(n){fila=emb(PAISES.map((_,k)=>k)).slice(0,n);i=0;pts=0;erros=[];show()}
function show(){
  resp=false;limpar();const k=fila[i];
  document.getElementById('p'+k).setAttribute('class','pais alvo');anel(k);
  const ops=opcoes(k);
  app.innerHTML=`<div class="top"><span class="num">${i+1}/${fila.length}</span><div class="prog"><i style="width:${i/fila.length*100}%"></i></div><span class="pts">⭐ ${pts}</span></div>
  <h2>Qual é esse país?</h2>
  <div class="ops">${ops.map((o,j)=>`<button class="op" data-k="${o}"><b>${L[j]}</b><span>${PAISES[o].n}</span></button>`).join('')}</div>
  <div class="fb" id="fb"></div>
  <button class="btn" id="next">${i<fila.length-1?'Próximo país →':'Ver resultado'}</button>
  <div class="legenda"><span><i style="background:#c9372c"></i>país da pergunta</span></div>`;
  app.querySelectorAll('.op').forEach(b=>b.onclick=()=>responde(+b.dataset.k,b));
  document.getElementById('next').onclick=()=>{i++;i<fila.length?show():fim()};
  if(window.innerWidth<900)window.scrollTo({top:0,behavior:'smooth'});
}
function responde(e,btn){
  if(resp)return;resp=true;const k=fila[i],ok=e===k,p=PAISES[k];
  app.querySelectorAll('.op').forEach(b=>{b.disabled=true;if(+b.dataset.k===k)b.classList.add('ok')});
  if(!ok){btn.classList.add('no');erros.push(k);document.getElementById('p'+e).setAttribute('class','pais errou');rotulo(e)}else pts++;
  document.getElementById('p'+k).setAttribute('class','pais certo');marks.innerHTML='';anel(k,'verde');rotulo(k);if(!ok)rotulo(e);
  const luso=p.l===1?' Lá também se fala <b>português</b>!':p.l===2?' O português é uma das línguas oficiais de lá!':'';
  const fb=document.getElementById('fb');fb.className='fb show '+(ok?'ok':'no');
  fb.innerHTML=`<strong>${ok?['Isso aí!','Mandou bem!','Axé! Acertou!','Certíssimo!','Show!'][i%5]:'Era '+p.n+'!'}</strong>Capital: <b>${p.c}</b>.${luso}${ok?'':`<br><span style="font-size:15px">Em laranja no mapa está ${PAISES[e].n}.</span>`}`;
  app.querySelector('.pts').textContent='⭐ '+pts;
  document.getElementById('next').style.display='block';
}
function fim(){
  limpar();erros.forEach(k=>{document.getElementById('p'+k).setAttribute('class','pais alvo');anel(k);rotulo(k)});
  const n=fila.length,pc=pts/n;
  const m=pc>=.9?'Vocês são craques da geografia africana! 🏆':pc>=.7?'Muito bem! 🎉':pc>=.5?'Bom trabalho! Bora treinar mais 💪':'A África é enorme — joguem de novo! 🌍';
  app.innerHTML=`<div class="big">${pts}/${n}</div><p class="msg">${m}</p>
  <button class="btn" id="re">Jogar de novo</button><button class="btn sec" id="cp">Voltar ao início</button>
  ${erros.length?`<div class="rev"><h3>Países para revisar (em vermelho no mapa)</h3>${erros.map(k=>`<div class="it"><b>${PAISES[k].n}</b> — capital ${PAISES[k].c}</div>`).join('')}</div>`:''}`;
  document.getElementById('re').onclick=()=>inicia(n);document.getElementById('cp').onclick=capa;
}
capa();
</script>
</body>
</html>
