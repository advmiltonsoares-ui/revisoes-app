<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz dos Esportes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap">
<style>
/* VOICE: animado, de arquibancada, para um aluno de 12 anos
   IDEA: o placar eletrônico do estádio à noite
   PICTURE: o atleta desenhado de cada pergunta, grande, e o placar que acende
   COLOUR and TYPE: noite verde-escura, amarelo de placar, laranja de destaque; Anton + Inter
   LAYOUT: placar no topo, pergunta em uma coluna, respostas grandes para o dedo */
:root{color-scheme:dark;--bg:#0B1E14;--panel:#12301F;--ink:#F3EFE4;--muted:#B9CBBF;--y:#F2C230;--o:#E2702C;--ok:#3FD394;--bad:#FF6B5B;--line:#21462F}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 40% at 15% -5%,rgba(255,246,208,.16),transparent 70%),radial-gradient(60% 40% at 85% -5%,rgba(255,246,208,.16),transparent 70%)}
.wrap{position:relative;max-width:720px;margin:0 auto;padding:16px max(16px,4vw) 48px;display:flex;flex-direction:column;gap:16px}
h1,.d{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.01em;margin:0;line-height:1.05}
h1{font-size:clamp(40px,9vw,64px);text-transform:uppercase}
h1 span{color:var(--y)}
.board{background:#050D08;border:3px solid #1E3A28;border-radius:20px;padding:12px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;box-shadow:0 0 0 6px #0F2619}
.cell{text-align:center}.cell small{display:block;font-size:13px;color:var(--muted);font-weight:600}
.led{font-family:Anton,sans-serif;font-size:44px;line-height:1;color:var(--y);text-shadow:0 0 14px rgba(242,194,48,.55);font-variant-numeric:tabular-nums}
.led.g{color:var(--ok);text-shadow:0 0 14px rgba(63,211,148,.5)}.led.r{color:var(--bad);text-shadow:0 0 14px rgba(255,107,91,.5)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:var(--y);transition:width .3s}
.card{background:var(--panel);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px;animation:in .3s ease-out}
.art{aspect-ratio:16/10;border-radius:18px;overflow:hidden;border:4px solid var(--ink)}
.art svg{display:block;width:100%;height:100%}
.tag{align-self:flex-start;background:var(--o);color:#1A0B02;font-weight:800;font-size:14px;padding:4px 12px;border-radius:99px}
.q{font-size:clamp(22px,5vw,28px);font-weight:800;line-height:1.25;margin:0}
.opts{display:grid;gap:10px}.opts.two{grid-template-columns:1fr 1fr}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;min-height:56px;padding:12px 16px;font-weight:700;color:var(--ink);background:#1B4230;border:2px solid #2A5A40;text-align:left;transition:transform .1s}
button:active{transform:scale(.97)}button:focus-visible{outline:3px solid var(--y);outline-offset:2px}
button:disabled{cursor:default}
.opt.right{background:#16503A;border-color:var(--ok)}.opt.wrong{background:#5A1F1A;border-color:var(--bad)}
.opts.two .opt{text-align:center;font-size:20px}
.main{background:var(--y);color:#13201A;border-color:var(--y);text-align:center;font-size:19px;width:100%}
.ghost{text-align:center;background:transparent}
.fb{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.fb.ok{background:#16503A}.fb.no{background:#5A1F1A}
.fb b{font-family:Anton,sans-serif;font-weight:400;font-size:24px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.match>div{display:flex;flex-direction:column;gap:10px}
.mi{text-align:center}.mi.sel{border-color:var(--y);background:#3A3410}.mi.done{border-color:var(--ok);background:#16503A;color:var(--ok)}.mi.err{border-color:var(--bad);background:#5A1F1A}
.res{text-align:center;align-items:center}
.big{font-family:Anton,sans-serif;font-size:clamp(72px,20vw,120px);line-height:1;color:var(--y);text-shadow:0 0 24px rgba(242,194,48,.5)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%}
.stat{background:#0E2419;border-radius:14px;padding:12px}.stat .d{font-size:36px}.stat span{display:block;color:var(--muted);font-size:14px;font-weight:600}
ul.tips{text-align:left;margin:0;padding-left:20px;width:100%}
.start{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.start .art{aspect-ratio:1;border-width:3px}
.muted{color:var(--muted)}
.nav{position:relative;max-width:720px;margin:0 auto;padding:12px max(16px,4vw) 0;display:flex;gap:10px;flex-wrap:wrap}.nav a{color:var(--ink);background:#1B4230;border:2px solid #2A5A40;border-radius:99px;padding:8px 16px;text-decoration:none;font-weight:700;font-size:15px}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

  return `<div class="board"><div class="cell" style="${vez===0?'outline:3px solid #4DA3FF;border-radius:12px':''}"><div class="led" style="color:#4DA3FF;text-shadow:0 0 14px rgba(77,163,255,.5)">${S.tm[0]}</div><small>👦 Meninos</small></div>
  <div class="cell"><div class="led" style="font-size:30px">${Math.min(S.i+1,n)}/${n}</div><small>pergunta</small></div>
  <div class="cell" style="${vez===1?'outline:3px solid #FF6FB3;border-radius:12px':''}"><div class="led" style="color:#FF6FB3;text-shadow:0 0 14px rgba(255,111,179,.5)">${S.tm[1]}</div><small>👧 Meninas</small></div></div>
  <div class="bar" aria-label="progresso"><span style="width:${S.res.length/n*100}%"></span></div>
  <p style="margin:0;text-align:center;font-family:Anton,sans-serif;font-size:30px;color:${vez===0?'#4DA3FF':'#FF6FB3'}">Vez ${vez===0?'dos 👦 MENINOS':'das 👧 MENINAS'}</p>`;
}
function pergunta(){
  const q=S.l[S.i];let corpo='';
  if(q.t==='mc')corpo=`<div class="opts">${q.os.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
  if(q.t==='tf')corpo=`<div class="opts two"><button class="opt" data-v="1">Verdadeiro</button><button class="opt" data-v="0">Falso</button></div>`;
  if(q.t==='match')corpo=`<p class="muted" style="margin:0">Toque num item da esquerda e depois no par certo da direita.</p><div class="match"><div>${q.L.map(x=>`<button class="mi" data-l="${x.i}">${esc(x.t)}</button>`).join('')}</div><div>${q.R.map(x=>`<button class="mi" data-r="${x.i}">${esc(x.t)}</button>`).join('')}</div></div>`;
  $.innerHTML=placar()+`<div class="card"><span class="tag">Pergunta ${S.i+1} de ${S.l.length} · ${esc(q.tag)}</span>
   ${q.img?`<div class="art">${IMG[q.img]}</div>`:''}<p class="q">${esc(q.q)}</p>${corpo}</div><div id="fb"></div>`;
  const fim=(ok,certo)=>responder(q,ok,certo);
  if(q.t==='mc')$.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const ok=+b.dataset.i===q.ai;$.querySelectorAll('[data-i]').forEach(x=>{x.disabled=true;if(+x.dataset.i===q.ai)x.classList.add('right')});if(!ok)b.classList.add('wrong');fim(ok,q.os[q.ai])});
  if(q.t==='tf')$.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const ok=(b.dataset.v==='1')===q.a;$.querySelectorAll('[data-v]').forEach(x=>{x.disabled=true;if((x.dataset.v==='1')===q.a)x.classList.add('right')});if(!ok)b.classList.add('wrong');fim(ok,q.a?'Verdadeiro':'Falso')});
  if(q.t==='match'){let L=null,err=0,done=0;
    $.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{$.querySelectorAll('[data-l]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');L=+b.dataset.l});
    $.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(L===null)return;const l=$.querySelector(`[data-l="${L}"]`);
      if(+b.dataset.r===L){[l,b].forEach(x=>{x.classList.remove('sel');x.classList.add('done');x.disabled=true});done++;if(done===q.pairs.length)fim(err===0,null,err)}
      else{err++;[l,b].forEach(x=>x.classList.add('err'));setTimeout(()=>[l,b].forEach(x=>x.classList.remove('err','sel')),400)}L=null});}
}
function responder(q,ok,certo,err){
  if(ok){S.ok++;S.pts+=10;S.tm[S.i%2]+=10}S.res.push({q,ok});
  const ult=S.i+1>=S.l.length;
  const extra=!ok&&certo!=null?`<span>Resposta certa: <b style="font-family:inherit;font-size:inherit">${esc(certo)}</b></span>`:(!ok&&err?`<span>Você errou ${err} ${err>1?'ligações':'ligação'} antes de completar. Para ganhar os pontos, é preciso ligar tudo sem errar.</span>`:'');
  document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'GOOOL! +10 para '+(S.i%2===0?'os meninos':'as meninas'):'Na trave!'}</b>${extra}<span>${esc(q.e)}</span></div>
   <button class="main" id="nx" style="margin-top:12px">${ult?'Ver o placar final':'Próxima pergunta'}</button>`;
  const b=$.querySelectorAll('.board .led');b[0].textContent=S.tm[0];b[2].textContent=S.tm[1];
  $.querySelector('.bar span').style.width=(S.res.length/S.l.length*100)+'%';
  const nx=document.getElementById('nx');nx.onclick=()=>{if(ult)final();else{S.i++;pergunta();scrollTo(0,0)}};
  nx.scrollIntoView({block:'nearest'});
}
function final(){
  const [m,f]=S.tm;
  const titulo=m>f?'👦 Os MENINOS venceram!':f>m?'👧 As MENINAS venceram!':'🤝 Empate!';
  $.innerHTML=`<div class="card res"><span class="tag" style="align-self:center">Placar final</span>
   <p class="q" style="font-family:Anton,sans-serif;font-size:clamp(36px,8vw,56px);font-weight:400">${titulo}</p>
   <div class="stats"><div class="stat"><div class="d" style="color:#4DA3FF">${m}</div><span>👦 Meninos</span></div><div class="stat"><div class="d" style="color:#FF6FB3">${f}</div><span>👧 Meninas</span></div></div>
   <button class="main" id="again">Jogar de novo</button><button class="ghost" id="home">Início</button></div>`;
  document.getElementById('again').onclick=()=>{comecar();scrollTo(0,0)};document.getElementById('home').onclick=inicio;scrollTo(0,0);
}
inicio();
}
</script></body></html>
